name: Deploy Web App (GitHub Pages)

on:
  push:
    branches:
      - claude/env-permissions-session-restart-154onb
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Web App
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: node scripts/source-check.js

      - name: Build web app
        run: npx expo export --platform web

      - name: Add APK download page
        run: |
          cat > dist/download.html <<'HTML'
          <!doctype html>
          <html lang="ko">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>차량운행시스템 APK 다운로드</title>
            <style>
              * { box-sizing: border-box; }
              body {
                margin: 0;
                min-height: 100vh;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #eef3fb;
                color: #172033;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
              }
              main {
                width: min(100%, 520px);
                background: #fffdfb;
                border: 1px solid #e3e8f5;
                border-radius: 28px;
                padding: 28px;
                box-shadow: 0 22px 48px rgba(79, 106, 230, 0.16);
              }
              .brand { color: #4f6ae6; font-size: 15px; font-weight: 900; margin-bottom: 10px; }
              h1 { margin: 0; font-size: 28px; line-height: 1.25; letter-spacing: 0; }
              p { margin: 14px 0 22px; color: #66728f; font-size: 15px; line-height: 1.6; font-weight: 700; }
              a.primary {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 58px;
                border-radius: 18px;
                background: #4f6ae6;
                color: white;
                text-decoration: none;
                font-size: 17px;
                font-weight: 900;
                box-shadow: 0 14px 30px rgba(79, 106, 230, 0.28);
              }
              a.secondary {
                display: block;
                margin-top: 16px;
                text-align: center;
                color: #52607d;
                font-size: 13px;
                font-weight: 800;
                text-decoration: none;
              }
              .note {
                margin-top: 20px;
                padding: 14px;
                border-radius: 16px;
                background: #f5f7fc;
                color: #66728f;
                font-size: 13px;
                line-height: 1.5;
                font-weight: 700;
              }
            </style>
          </head>
          <body>
            <main>
              <div class="brand">차량운행시스템</div>
              <h1>최신 Android APK 다운로드</h1>
              <p>아래 버튼은 항상 최신 APK 파일로 연결됩니다. Actions의 Artifacts를 찾을 필요가 없습니다.</p>
              <a class="primary" href="https://github.com/jmpark0611-art/vechicle/releases/download/latest-apk/app-release.apk">APK 바로 다운로드</a>
              <a class="secondary" href="https://github.com/jmpark0611-art/vechicle/releases/tag/latest-apk">Release 페이지 열기</a>
              <div class="note">새 빌드가 완료되면 이 버튼의 파일이 자동으로 최신 버전으로 교체됩니다.</div>
            </main>
          </body>
          </html>
          HTML

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
