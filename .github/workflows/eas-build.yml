name: EAS Build (Android APK)

on:
  push:
    branches:
      - claude/env-permissions-session-restart-154onb
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Check Expo login
        run: eas whoami

      - name: Initialize EAS project
        run: eas init --non-interactive --force
        continue-on-error: true

      - name: Build Android APK (preview)
        run: eas build --profile preview --platform android --non-interactive
