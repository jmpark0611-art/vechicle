name: Android APK

on:
  push:
    branches:
      - claude/env-permissions-session-restart-154onb
      - rebuild/clean-sdk54-start
      - feature/obd-ble-elm327-probe
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls "${ANDROID_HOME}/platforms" || true
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run verify

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure release build
        run: |
          echo "android.enableProguardInReleaseBuilds=false" >> android/gradle.properties
          sed -i 's/signingConfig signingConfigs\.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-system-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: "차량운행시스템 APK ${{ github.run_id }}"
          body: |
            자동 빌드된 APK 파일입니다.
            커밋: ${{ github.sha }}
            브랜치: ${{ github.ref_name }}
            실행: ${{ github.run_id }}
          files: android/app/build/outputs/apk/release/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update stable APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "차량운행시스템 최신 APK"
          body: |
            항상 최신 APK를 받을 수 있는 고정 다운로드 릴리스입니다.

            직접 다운로드:
            https://github.com/jmpark0611-art/vechicle/releases/download/latest-apk/app-release.apk

            커밋: ${{ github.sha }}
            브랜치: ${{ github.ref_name }}
            실행: ${{ github.run_id }}
          files: android/app/build/outputs/apk/release/*.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
